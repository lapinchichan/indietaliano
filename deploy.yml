name: Pubblica Indietaliano
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica repository
        uses: actions/checkout@v4
      - name: Prepara Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Genera archivio e schede
        run: node build-games.js
      - name: Prepara la cartella pubblica
        run: |
          mkdir -p _site
          cp index.html gestione.html gestione.css style.css home.css retro-editorial.css typography.css \
            script.js detail-page.js games.js site-config.js _site/
          cp -R assets giochi _site/
          touch _site/.nojekyll
      - name: Configura GitHub Pages
        uses: actions/configure-pages@v5
      - name: Carica il sito
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Pubblica su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
